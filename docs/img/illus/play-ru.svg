    <circle cx="96" cy="104" r="8.6" fill="#9aa8bf"/>
      <text x="78" y="30" text-anchor="end" font-size="11" font-weight="400" fill="#0e1828">12</text><text x="78" y="188" text-anchor="end" font-size="11" font-weight="400" fill="#0e1828">6</text>
