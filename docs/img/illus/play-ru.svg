<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" font-family="Segoe UI, Arial, sans-serif" class="illus-svg" viewBox="0 0 320 200" role="img" aria-label="Проверка люфтов: качать колесо"><rect width="320" height="200" rx="10" fill="#e3e8f0"/><title>Проверка люфтов: качать колесо</title><circle cx="96" cy="104" r="66" fill="#2b3242" stroke="#1a202d" stroke-width="2"/>
