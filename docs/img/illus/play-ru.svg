      <text x="184" y="40" text-anchor="start" font-size="12" font-weight="600" fill="#955700">сверху-снизу (12 и 6 ч):</text>
      <text x="184" y="56" text-anchor="start" font-size="11" font-weight="400" fill="#44536b">подшипник ступицы,</text><text x="184" y="70" text-anchor="start" font-size="11" font-weight="400" fill="#44536b">шаровые опоры, шкворни</text>
      <text x="184" y="112" text-anchor="start" font-size="12" font-weight="600" fill="#1c5fd6">по бокам (3 и 9 ч):</text>
      <text x="184" y="128" text-anchor="start" font-size="11" font-weight="400" fill="#44536b">рулевые тяги</text><text x="184" y="142" text-anchor="start" font-size="11" font-weight="400" fill="#44536b">и наконечники</text>
      <text x="184" y="176" text-anchor="start" font-size="11" font-weight="400" fill="#5a6880">колесо вывешено</text></svg>
