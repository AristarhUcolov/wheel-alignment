name: Выпуск

# Метка вида v2.0.0 — и через несколько минут на странице релизов лежит
# готовая программа: wheelalign.exe для Windows (открывается в своём окне) и
# сборки для Linux и macOS (открываются в браузере).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Тесты
        run: go test ./...

      - name: Сборка
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/wheelalign.exe ./cmd/wheelalign
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/wheelalign-linux-amd64 ./cmd/wheelalign
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/wheelalign-macos-arm64 ./cmd/wheelalign
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/wheelalign-macos-amd64 ./cmd/wheelalign

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Сход-развал · Wheel alignment $GITHUB_REF_NAME" --generate-notes
